<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#123331;
    --ink-2:#1c4744;
    --paper:#efe8d8;
    --paper-2:#e6ddc8;
    --paper-line:#d8cbaa;
    --text:#20241f;
    --text-dim:#5a6058;
    --ochre:#b8811f;
    --ochre-deep:#8f640f;
    --brick:#a3392a;
    --cream:#f8f5ec;
    --fallback-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    --fallback-serif: Georgia, "Times New Roman", serif;
    --fallback-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --cream-fixed:#f8f5ec; /* always-light text/dots for the always-dark ink header & date picker — must NOT shift in dark mode */
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#16241f; --paper-2:#1c2c26; --paper-line:#2c3b33;
      --text:#eee7d6; --text-dim:#9fa89c; --cream:#1c2c26;
      --ink:#0d1a17; --ink-2:#12241f;
    }
  }
  :root[data-theme="dark"]{
    --paper:#16241f; --paper-2:#1c2c26; --paper-line:#2c3b33;
    --text:#eee7d6; --text-dim:#9fa89c; --cream:#1c2c26;
    --ink:#0d1a17; --ink-2:#12241f;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--ink);
    background-image: linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    font-family: 'IBM Plex Sans', var(--fallback-sans);
    color:var(--text);
    overscroll-behavior:none;
  }
  body{
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}

  .app{
    height:100%;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:14px 8px 10px;
  }
  @media (min-width:480px){
    .app{ padding:18px 14px 12px; }
  }

  .topbar{
    width:100%;
    max-width:480px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    padding:2px 4px 12px;
    color:var(--cream-fixed);
  }
  .brand{
    font-family:'Source Serif 4', var(--fallback-serif);
    font-weight:700;
    font-size:clamp(15px, 4.6vw, 20px);
    letter-spacing:0.2px;
    color:var(--cream-fixed);
    flex-shrink:1;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand span{ color: var(--ochre); }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .meta{
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:11px;
    color:#c9c2ac;
    text-align:right;
    line-height:1.5;
    min-width:0;
  }
  .fsbtn{
    flex-shrink:0;
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #3c4d45;
    border-radius:7px;
    background:var(--ink-2);
    color:var(--cream-fixed);
    cursor:pointer;
    padding:0;
    transition: border-color .15s, background .15s;
  }
  .fsbtn:hover, .fsbtn:focus{ border-color:var(--ochre); }
  .fsbtn svg{ width:14px; height:14px; }

  .datepicker{
    width:100%;
    max-width:480px;
    display:flex;
    gap:6px;
    padding:0 4px 12px;
  }
  .dateselect{
    flex:1 1 0;
    min-width:0;
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:12px;
    font-weight:500;
    color:var(--cream-fixed);
    background:var(--ink-2);
    border:1px solid #3c4d45;
    border-radius:8px;
    padding:7px 6px;
    text-align:center;
    text-align-last:center;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
    transition: border-color .15s;
  }
  .dateselect:hover, .dateselect:focus{ border-color:var(--ochre); }
  .dateselect option{ background:var(--ink-2); color:var(--cream-fixed); }

  .stage{
    position:relative;
    width:100%;
    max-width:480px;
    flex:1;
    display:flex;
    align-items:stretch;
    min-height:0;
  }

  .navzone{
    flex:0 0 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  @media (min-width:480px){
    .navzone{ flex-basis:28px; }
    .navzone svg{ width:16px; height:16px; }
  }
  .navzone svg{ width:14px; height:14px; opacity:0.55; transition:opacity .15s; }
  .navzone:hover svg{ opacity:0.95; }
  .navzone.disabled{ pointer-events:none; opacity:0.15; }

  .cardwrap{
    flex:1;
    min-width:0;
    position:relative;
    overflow:hidden;
    border-radius:18px;
  }

  /* .card only ever handles the left-right slide animation — it never
     scrolls itself, so animating its transform never fights a scroll
     gesture. .cardscroll is the one and only element that scrolls, and
     it never has a transition/transform on it, so scrolling stays smooth. */
  .card{
    position:absolute;
    inset:0;
    border-radius:18px;
    overflow:hidden;
    will-change:transform, opacity;
    pointer-events:none;
    transition: transform .38s cubic-bezier(.22,.68,0,1), opacity .3s ease;
  }
  .card.active{ pointer-events:auto; }
  .card.enter-right{ transform:translateX(24px); opacity:0; }
  .card.enter-left{ transform:translateX(-24px); opacity:0; }
  .card.active{ transform:translateX(0); opacity:1; }
  .card.leave-left{ transform:translateX(-24px); opacity:0; }
  .card.leave-right{ transform:translateX(24px); opacity:0; }

  .cardscroll{
    height:100%;
    width:100%;
    overflow-y:auto;
    overflow-x:hidden;
    overscroll-behavior:contain;
    background:var(--paper);
    border:1px solid var(--paper-line);
    border-radius:18px;
  }

  .cardinner{
    padding:18px 16px 22px;
    display:flex;
    flex-direction:column;
    min-height:100%;
    min-width:0;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  @media (min-width:480px){
    .cardinner{ padding:22px 22px 26px; }
  }

  .tag{
    display:inline-block;
    align-self:flex-start;
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:11px;
    letter-spacing:0.06em;
    font-weight:600;
    color:var(--ochre-deep);
    background:transparent;
    border:1px solid var(--ochre-deep);
    border-radius:100px;
    padding:4px 10px 3px;
    margin-bottom:14px;
    flex-shrink:0;
    max-width:100%;
    overflow-wrap:break-word;
  }

  h1{
    font-family:'Source Serif 4', var(--fallback-serif);
    font-weight:700;
    font-size:clamp(20px, 5.8vw, 26px);
    line-height:1.22;
    margin:0 0 14px;
    color:var(--text);
    flex-shrink:0;
    overflow-wrap:break-word;
  }

  .dek p{
    font-size:15.5px;
    line-height:1.66;
    color:var(--text);
    margin:0 0 14px;
    overflow-wrap:break-word;
  }
  .dek p:last-child{ margin-bottom:0; }
  .dek b{ font-weight:600; color:var(--text); }

  .stats{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:10px;
    margin-top:18px;
    flex-shrink:0;
  }
  .stat{
    background:var(--cream);
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:10px 12px;
    min-width:0;
  }
  .stat .v{
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-weight:600;
    font-size:15.5px;
    color:var(--text);
    display:flex;
    align-items:baseline;
    gap:5px;
    flex-wrap:wrap;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .stat .v.up{ color:#2c6e49; }
  .stat .v.down{ color:var(--brick); }
  .stat .l{
    font-size:11px;
    color:var(--text-dim);
    margin-top:3px;
    line-height:1.3;
    overflow-wrap:break-word;
  }

  .source{
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:10.5px;
    color:var(--text-dim);
    margin-top:16px;
    padding-top:10px;
    border-top:1px dashed var(--paper-line);
    flex-shrink:0;
  }

  .scrollcue{
    position:sticky;
    bottom:0;
    left:0;
    right:0;
    height:28px;
    margin-top:-28px;
    background:linear-gradient(180deg, rgba(239,232,216,0) 0%, var(--paper) 78%);
    pointer-events:none;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:5px;
  }
  .scrollcue svg{ width:14px; height:14px; opacity:0.4; color:var(--text-dim); }
  .cardscroll.at-bottom .scrollcue{ display:none; }

  .progressrow{
    width:100%;
    max-width:480px;
    display:flex;
    justify-content:center;
    gap:5px;
    padding:14px 4px 4px;
    flex-wrap:wrap;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:#3c4d45;
    cursor:pointer;
    transition: background .2s, transform .2s;
  }
  .dot.done{ background:var(--ochre); }
  .dot.now{ background:var(--cream-fixed); transform:scale(1.4); }

  .hint{
    text-align:center;
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:10.5px;
    color:#7d8a80;
    padding-top:10px;
    letter-spacing:0.02em;
  }

  :focus-visible{ outline:2px solid var(--ochre); outline-offset:2px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">Finance Ledger<span>.</span></div>
    <div class="topbar-right">
      <div class="meta" id="metaTop">— · —</div>
      <button class="fsbtn" id="fsBtn" type="button" aria-label="Enter fullscreen" title="Fullscreen">
        <svg id="fsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="8 3 3 3 3 8"></polyline>

</div>

<script>
/* ============================================================
   LEDGER — data layer
   Every new newspaper upload adds ONE new entry to NEWS_BY_DATE
   below, keyed "YYYY-MM-DD", containing that day's simplified
   finance stories in the same {tag, headline, body, stats,
   source} shape used here. Never edit or remove a past date's
   entry — just add the next one. The date-chip row at the top
   of the page is generated automatically from these keys, and
   selecting a date shows only that day's stories.
   ============================================================ */
const NEWS_BY_DATE = {
  "2026-06-09": {
    label: "09 Jun 2026",
    stories: [
  {
    tag: "Markets",
    headline: "War jitters in the Middle East just gave Indian markets their worst day in weeks",
    body: [
      "The Nifty 50 — the index that tracks India's 50 biggest listed companies and is the most-watched barometer of the stock market's health — fell 1.04% on Monday to close at 23,123 points. The trigger was news that Israel and Iran had traded missile fire for the first time since a U.S.-brokered ceasefire in April, reviving fears of a wider war in West Asia.",
      "The connection between a war thousands of kilometres away and Indian stock prices runs through oil. West Asia supplies a huge share of the world's crude, so any threat of conflict there tends to push oil prices up — and India imports about 85% of the oil it uses, so costlier crude usually means a costlier economy at home. On Monday, Brent crude (the global oil-price benchmark) rose to $94.38 a barrel, from about $93 on Friday.",
      "The damage on Dalal Street was broad: 20 of the Nifty's 21 sector indices fell, with only healthcare stocks bucking the trend. Adding to the pressure, foreign institutional investors (FIIs) — big overseas funds that buy and sell Indian shares — sold a net ₹51,000 crore worth of Indian stocks in just the first week of June. When foreign money leaves this fast, it also weakens the rupee, which slid to 95.61 against the U.S. dollar."
    ],
    stats: [
      {v:"23,123", down:true, l:"Nifty 50 close, down 1.04% on the day"},
      {v:"$94.38", up:true, l:"Brent crude oil price, per barrel"},
      {v:"₹51,000cr", l:"Foreign investors' net selling of Indian stocks, week of June 1"},
      {v:"₹95.61", down:true, l:"Rupee's exchange rate against the US dollar"}
    ],
    source: "The Hindu · Business"
  },
  {
    tag: "Energy",
    headline: "Delhi just made subsidised LPG cylinders scarcer for poor households — even as fuel firms lose money on every litre they sell",
    body: [
      "The Pradhan Mantri Ujjwala Yojana (PMUY) is the government's flagship scheme that gives free gas connections to poor households and then subsidises the cost of refilling their cooking-gas cylinders — about 10.55 crore households are covered. Until now, each household could get nine subsidised refills a year. The Petroleum Ministry has quietly cut that to just four, citing pressure on global LPG supplies from the war in West Asia.",
      "The subsidy math shows why the cut matters: a domestic cylinder costs ₹942 in Delhi, but a PMUY household pays only ₹642 thanks to a ₹300-per-cylinder government subsidy — a discount of about 60% versus what a cylinder would cost at full international pricing (which officials put closer to ₹1,600). A PMUY family typically uses four to five cylinders a year for cooking, so the cut to four refills could leave many of them short, especially in months when they need more.",
      "Meanwhile, the companies that actually sell the fuel are losing money on it. State-run oil marketing companies are absorbing an 'under-recovery' — the gap between what it costs them to supply the fuel and what they're allowed to charge at the pump — of about ₹30 on every litre of diesel and ₹6 on every litre of petrol sold, according to a senior Petroleum Ministry official. In effect, the government is choosing to shield consumers from the full spike in global fuel costs, while both its subsidy budget and its state oil companies absorb the strain."
    ],
    stats: [
      {v:"9 → 4", down:true, l:"Subsidised LPG refills per year under Ujjwala"},
      {v:"₹642", l:"Price a PMUY household pays per cylinder, vs. ₹942 market price"},
      {v:"₹30/litre", l:"Loss state oil firms take on every litre of diesel sold"},
      {v:"₹6/litre", l:"Loss state oil firms take on every litre of petrol sold"}
    ],
    source: "The Hindu · Business"
  },
  {
    tag: "Auto",
    headline: "India's showrooms just had their best May ever — despite a heatwave and rising fuel prices",
    body: [
      "Automakers usually report 'wholesale' numbers — how many vehicles they shipped to dealers — but the Federation of Automobile Dealers Associations (FADA) tracks something more telling: 'retail' sales, meaning vehicles that customers actually drove out of showrooms. By that measure, May 2026 was the best May on record, with 25.31 lakh (2.53 million) vehicles retailed across India — up 9.55% from a year earlier.",
      "Passenger vehicles (cars and SUVs) led the charge, up 23.25% to a record 4.02 lakh units for the month. Two-wheelers grew a more modest 7.54%, while tractors — often a proxy for how rural, farm-dependent India is feeling — rose 11.17%. Commercial vehicles and three-wheelers posted smaller single-digit gains.",
      "The one soft spot: compared with April, overall retail sales actually dipped 6.75%. Industry body FADA attributed this to the usual post-tax-season cooldown and a delayed monsoon, which tends to make rural buyers — a big chunk of two-wheeler and tractor demand — hold off on big purchases until the rains, and the income they bring, arrive."
    ],
    stats: [
      {v:"25.31 lakh", up:true, l:"Vehicles retailed in May, +9.55% year-on-year"},
      {v:"4.02 lakh", up:true, l:"Passenger vehicles sold — a new May record"},
      {v:"+23.25%", up:true, l:"Growth in passenger vehicle sales, year-on-year"},
      {v:"-6.75%", down:true, l:"Dip in sales compared with the previous month"}
    ],
    source: "The Hindu · Business"
  },
  {
    tag: "Solar",
    headline: "Solar developers just took the government to court over a rule that could make panels far pricier",
    body: [
      "India's solar-panel makers have long been required to use only government-approved manufacturers when assembling panels. From June 1, that rule tightened one level deeper: most new solar projects must now also use solar cells — the light-absorbing components that actually generate electricity inside a panel — made only by companies on a similar approved list, rather than importing cheaper cells from abroad, mainly China.",
      "The problem, say solar industry bodies from Karnataka, Kerala and Tamil Nadu who have petitioned the Karnataka High Court, is price: domestically made cells sell for around ₹13 a watt, versus roughly ₹5 a watt for imported ones — more than double. They argue India simply doesn't make enough cells yet to meet demand: the country's cell-manufacturing capacity is only around 27 gigawatts (GW), even though its capacity to assemble finished panels has already reached about 210 GW. They want the rule's enforcement deferred by at least a year.",
      "The petitioners also flagged who stands to gain: by their estimate, at current price gaps only four or five companies hold the 'high-efficiency' cell-making licences needed to qualify, and together they could pocket an extra ₹24,000 crore a year once the rule kicks in — a cost that ultimately gets passed on to solar-project developers, and potentially to electricity prices more broadly. The government's counter-argument is that shielding domestic cell-makers from cheaper imports is necessary to build up India's own manufacturing base, rather than remaining permanently reliant on Chinese supply."
    ],
    stats: [
      {v:"₹5 → ₹13/watt", up:true, l:"Price gap: imported vs. domestically made solar cells"},
      {v:"27 GW", l:"India's current solar-cell manufacturing capacity"},
      {v:"210 GW", l:"India's solar panel-assembly capacity, by comparison"},
      {v:"₹24,000cr/yr", l:"Estimated extra revenue for local cell-makers, once enforced"}

    source: "The Hindu · Business"
  },
  {
    tag: "Trade",
    headline: "India just signed a trade deal with Oman that removes tariffs on 98% of its exports",
    body: [
      "The India-Oman Comprehensive Economic Partnership Agreement (CEPA) — essentially a broad free-trade deal covering goods, services and investment — came into force on June 1, 2026. Under it, Oman now offers duty-free access on 98.08% of its tariff categories, which together cover 99.38% of everything India actually exports there by value. Before the deal, only about 15.33% of India's exports to Oman entered duty-free.",
      "The sectors expected to benefit most are ones where India already has a foothold: textiles and apparel (India already supplies 43% of Oman's imported woven clothing), chemicals (nearly 39% of Oman's inorganic-chemical imports), and engineering goods, where Indian exporters currently hold only a 2-5% share of a market worth billions of dollars a year — leaving plenty of room to grow once tariffs disappear. For pharmaceuticals, the bigger win isn't tariffs but faster regulatory approvals, letting Indian-made, internationally-approved drugs enter the Omani market more quickly.",
      "Bilateral trade between the two countries has grown from $8.94 billion in 2023-24 to $11.18 billion in 2025-26. Beyond the trade numbers, Oman's location matters strategically: its ports at Sohar, Duqm and Salalah sit along some of the world's busiest shipping lanes, giving Indian businesses a potential gateway to the wider Gulf region and East Africa, not just to Oman itself."
    ],
    stats: [
      {v:"98.08%", up:true, l:"Share of Oman's tariff lines now duty-free for India"},
      {v:"$11.18bn", up:true, l:"India-Oman bilateral trade, FY2025-26"},
      {v:"15.33% → 99.38%", up:true, l:"Share of India's exports to Oman entering duty-free"},
      {v:"$447mn", l:"India's trade surplus with Oman in services, 2024"}
    ],
    source: "The Hindu · Editorial/Business"
  },
  {
    tag: "Deals",
    headline: "TCS lands a multi-year, multimillion-euro deal to modernise a Canadian insurer's tech",
    body: [
      "Tata Consultancy Services (TCS), India's largest IT services company, has signed a multi-year transformation and IT-management agreement with Canada Life, a Canadian life-insurance and pensions company, for an undisclosed sum described only as 'multimillion euros'.",
      "Under the deal, TCS will modernise Canada Life's technology backbone across its European operations — its data centres, core computing infrastructure, employee IT systems, and the software tools it relies on day to day — using artificial intelligence and other digital tools. The stated goal is to cut costs, improve performance and free up Canada Life to focus on its insurance business rather than running its own tech plumbing.",
      "Deals like this are a familiar playbook for Indian IT firms: large global financial companies, especially insurers and banks with ageing legacy systems, outsource the unglamorous but expensive work of running and upgrading their technology to firms like TCS, Infosys or Wipro, who can do it more cheaply and, increasingly, use AI to further cut the cost of that work."
    ],

      {v:"Multi-year", l:"Duration of the TCS-Canada Life contract"},
      {v:"Multimillion €", l:"Deal value (exact figure undisclosed)"}

  },
  {
    tag: "Corporate",
    headline: "A ₹18,000 crore shipyard project just got pulled from Tamil Nadu — Mazagon Dock wants Andhra Pradesh instead",
    body: [
      "Mazagon Dock Limited (MDL), India's top state-run shipbuilder, had signed an agreement with the Tamil Nadu government in September 2025 to build a massive shipbuilding cluster at Thoothukudi, with a stated investment of ₹15,000-18,000 crore. The plan was to build a facility capable of constructing Very Large Crude Carriers (VLCCs) — tankers big enough to carry up to 3 lakh tonnes of crude oil at once, a class of ship India currently has almost no capacity to build domestically.",
      "But in December 2025, Tamil Nadu instead signed an 'Exclusive Business Cooperation Agreement' for the same Thoothukudi site with South Korea's HD Hyundai, describing it as a plan for a 'second Ulsan' (Hyundai's giant home shipyard) worth an estimated $2-4 billion. MDL says the state's own rulebook for approving such projects — including forming a joint-venture company to run the selection process — was only finalised weeks after HD Hyundai had already been picked, raising questions about whether Indian companies were denied a fair chance to bid.",

    body: [
      "The current account is the broadest scorecard of money flowing into and out of a country — covering trade in goods and services, income from investments, and remittances sent home by workers abroad. India typically runs a deficit here, since it imports far more (oil and gold, especially) than it exports.",
      "For once, that flipped in the January-March quarter of FY26: India posted a current account surplus of $7.1 billion, or 1.4% of GDP, helped along by strong exports of computer and business services — the kind of white-collar, IT-driven exports that have quietly become one of India's biggest economic strengths.",
      "That one good quarter wasn't enough to erase the earlier part of the year, though. For the full 2025-26 financial year, India still ended with a current account deficit of $25.2 billion (0.6% of GDP) — roughly in line with the $22.9 billion deficit the year before. The takeaway: a services-driven surplus can show up in a single quarter, but India's underlying trade gap, largely from oil imports, hasn't gone away."

/* ============================================================
   UI layer — no need to touch this when refreshing NEWS_BY_DATE
   ============================================================ */
const wrap = document.getElementById('cardwrap');
const progressRow = document.getElementById('progressRow');
const yearSelect = document.getElementById('yearSelect');
const monthSelect = document.getElementById('monthSelect');
const daySelect = document.getElementById('daySelect');
const metaTop = document.getElementById('metaTop');
const prevZone = document.getElementById('prevZone');
const nextZone = document.getElementById('nextZone');

const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const dateKeys = Object.keys(NEWS_BY_DATE).sort(); // chronological, oldest to newest
let currentDate = dateKeys[dateKeys.length - 1]; // default to the latest date with news
let stories = [];
let idx = 0;
let cardEls = [];

// Build a nested year -> month -> [days] index from the flat date keys,
// so the dropdowns only ever show dates that actually have news.
const dateIndex = {};
dateKeys.forEach(key => {
  const [y, m, d] = key.split('-');
  dateIndex[y] = dateIndex[y] || {};
  dateIndex[y][m] = dateIndex[y][m] || [];
  dateIndex[y][m].push(d);
});

function fmtVal(s){
  const cls = s.up ? 'v up' : (s.down ? 'v down' : 'v');
  const arrow = s.up ? '▲' : (s.down ? '▼' : '');
  return `<div class="${cls}">${arrow ? `<span>${arrow}</span>`:''}${s.v}</div>`;
}

function buildCard(item){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="cardscroll">
      <div class="cardinner">
        <span class="tag">${item.tag}</span>
        <h1>${item.headline}</h1>
        <div class="dek">
          ${item.body.map(p => `<p>${p}</p>`).join('')}
        </div>
        <div class="stats">
          ${item.stats.map(s => `
            <div class="stat">
              ${fmtVal(s)}
              <div class="l">${s.l}</div>
            </div>`).join('')}
        </div>
        <div class="source">${item.source} · Story ${item._n} of ${stories.length}</div>
      </div>
      <div class="scrollcue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
    </div>
  `;
  const scrollEl = el.querySelector('.cardscroll');
  const cueParent = scrollEl; // scrollHeight/scrollTop measured here
  scrollEl.addEventListener('scroll', () => {
    const atBottom = cueParent.scrollHeight - cueParent.scrollTop - cueParent.clientHeight < 24;
    scrollEl.classList.toggle('at-bottom', atBottom);
  }, {passive:true});
  return el;
}

function fillSelect(selectEl, options){
  selectEl.innerHTML = options.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
}

// Populate the year dropdown with every year that has at least one story.
function populateYears(selectedYear){
  const years = Object.keys(dateIndex).sort();
  fillSelect(yearSelect, years.map(y => ({value:y, label:y})));
  yearSelect.value = selectedYear;
}

// Populate the month dropdown with only the months that have news for the given year.
function populateMonths(year, selectedMonth){
  const months = Object.keys(dateIndex[year]).sort();
  fillSelect(monthSelect, months.map(m => ({value:m, label:MONTH_NAMES[parseInt(m,10)-1]})));
  monthSelect.value = selectedMonth;
}

// Populate the day dropdown with only the days that have news for the given year+month.
function populateDays(year, month, selectedDay){
  const days = dateIndex[year][month].slice().sort();
  fillSelect(daySelect, days.map(d => ({value:d, label:String(parseInt(d,10))})));
  daySelect.value = selectedDay;
}

function initDatePicker(){
  const [y, m, d] = currentDate.split('-');
  populateYears(y);
  populateMonths(y, m);
  populateDays(y, m, d);
}

function goToDate(key){
  if(key === currentDate) return;
  currentDate = key;
  idx = 0;
  renderAll();
}

yearSelect.addEventListener('change', () => {
  const y = yearSelect.value;
  const months = Object.keys(dateIndex[y]).sort();
  const m = months[0];
  populateMonths(y, m);
  const days = dateIndex[y][m].slice().sort();
  const d = days[0];
  populateDays(y, m, d);
  goToDate(`${y}-${m}-${d}`);
});

monthSelect.addEventListener('change', () => {
  const y = yearSelect.value;
  const m = monthSelect.value;
  const days = dateIndex[y][m].slice().sort();
  const d = days[0];
  populateDays(y, m, d);
  goToDate(`${y}-${m}-${d}`);
});

daySelect.addEventListener('change', () => {
  const y = yearSelect.value;
  const m = monthSelect.value;
  const d = daySelect.value;
  goToDate(`${y}-${m}-${d}`);
});

function renderAll(){
  stories = NEWS_BY_DATE[currentDate].stories;
  wrap.innerHTML = '';
  cardEls = stories.map((item, i) => {
    item._n = i + 1;
    const el = buildCard(item);
    el.classList.add(i === 0 ? 'active' : 'enter-right');
    el.style.zIndex = i === 0 ? 2 : 1;
    wrap.appendChild(el);
    return el;
  });
  buildDots();
  updateMeta();
}

function buildDots(){
  progressRow.innerHTML = '';
  stories.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i < idx ? ' done' : '') + (i === idx ? ' now' : '');
    d.addEventListener('click', () => goTo(i));
    progressRow.appendChild(d);
  });
}

function updateMeta(){
  metaTop.textContent = `${idx+1} / ${stories.length} · ${NEWS_BY_DATE[currentDate].label}`;
  prevZone.classList.toggle('disabled', idx === 0);
  nextZone.classList.toggle('disabled', idx === stories.length - 1);
}

function goTo(newIdx){
  if(newIdx < 0 || newIdx >= stories.length || newIdx === idx) return;
  const dir = newIdx > idx ? 1 : -1;
  const current = cardEls[idx];
  const next = cardEls[newIdx];

  current.classList.remove('active');
  current.classList.add(dir > 0 ? 'leave-left' : 'leave-right');
  current.style.zIndex = 1;

  next.classList.remove('enter-right','enter-left','leave-left','leave-right');
  const nextScroll = next.querySelector('.cardscroll');
  if(nextScroll) nextScroll.scrollTop = 0;
  next.classList.add(dir > 0 ? 'enter-right' : 'enter-left');
  next.style.zIndex = 2;
  // force reflow so the transition triggers
  void next.offsetWidth;
  requestAnimationFrame(() => {
    next.classList.remove('enter-right','enter-left');
    next.classList.add('active');
  });

  idx = newIdx;
  buildDots();
  updateMeta();
}

prevZone.addEventListener('click', () => goTo(idx - 1));
nextZone.addEventListener('click', () => goTo(idx + 1));
prevZone.addEventListener('keydown', e => { if(e.key==='Enter') goTo(idx-1); });
nextZone.addEventListener('keydown', e => { if(e.key==='Enter') goTo(idx+1); });

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') goTo(idx + 1);
  if(e.key === 'ArrowLeft') goTo(idx - 1);
});

// touch / drag swipe on the card stack — only triggers on a mostly-horizontal
// gesture, so vertical scrolling to read a card is never hijacked
let startX = null, startY = null, dragging = false;
wrap.addEventListener('touchstart', (e) => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  dragging = true;
}, {passive:true});
wrap.addEventListener('touchend', (e) => {
  if(!dragging || startX === null) return;
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;
  if(Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.4){
    if(dx < 0) goTo(idx + 1); else goTo(idx - 1);
  }
  dragging = false; startX = null; startY = null;
}, {passive:true});

let mouseStartX = null, mouseStartY = null, mouseDown = false;
wrap.addEventListener('mousedown', (e) => { mouseDown = true; mouseStartX = e.clientX; mouseStartY = e.clientY; });
window.addEventListener('mouseup', (e) => {
  if(!mouseDown || mouseStartX === null) return;
  const dx = e.clientX - mouseStartX;
  const dy = e.clientY - mouseStartY;
  if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.4){
    if(dx < 0) goTo(idx + 1); else goTo(idx - 1);
  }
  mouseDown = false; mouseStartX = null; mouseStartY = null;
});

initDatePicker();
renderAll();
// initialise scroll-cue visibility for the first card
requestAnimationFrame(() => {
  const firstScroll = cardEls[0] && cardEls[0].querySelector('.cardscroll');
  if(firstScroll) firstScroll.dispatchEvent(new Event('scroll'));
});

/* ============================================================
   Fullscreen toggle — hides browser chrome on mobile so only
   the Ledger UI is visible. Falls back gracefully (hides the
   button) on browsers/webviews that don't support the API.
   ============================================================ */
const fsBtn = document.getElementById('fsBtn');
const fsIcon = document.getElementById('fsIcon');
const EXPAND_ICON = `<polyline points="8 3 3 3 3 8"></polyline><polyline points="16 3 21 3 21 8"></polyline><polyline points="3 16 3 21 8 21"></polyline><polyline points="21 16 21 21 16 21"></polyline>`;
const COMPRESS_ICON = `<polyline points="3 8 8 8 8 3"></polyline><polyline points="21 8 16 8 16 3"></polyline><polyline points="8 21 8 16 3 16"></polyline><polyline points="16 21 16 16 21 16"></polyline>`;

function fsElement(){
  return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
}
function fsSupported(){
  const el = document.documentElement;
  return !!(el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen);
}
function updateFsButton(){
  const active = !!fsElement();
  fsIcon.innerHTML = active ? COMPRESS_ICON : EXPAND_ICON;
  fsBtn.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
  fsBtn.title = active ? 'Exit fullscreen' : 'Fullscreen';
}
function enterFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if(!req) return;
  try{
    const r = req.call(el);
    if(r && r.catch) r.catch(() => {});
  }catch(err){ /* ignore — some webviews reject silently */ }
}
function exitFullscreen(){
  const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if(!exit) return;
  try{
    const r = exit.call(document);
    if(r && r.catch) r.catch(() => {});
  }catch(err){ /* ignore */ }
}
if(fsSupported()){
  fsBtn.addEventListener('click', () => {
    if(fsElement()) exitFullscreen(); else enterFullscreen();
  });
  document.addEventListener('fullscreenchange', updateFsButton);
  document.addEventListener('webkitfullscreenchange', updateFsButton);
  document.addEventListener('msfullscreenchange', updateFsButton);
  updateFsButton();
}else{
  // No Fullscreen API in this browser/webview — hide the control rather than show a dead button.
  fsBtn.style.display = 'none';
}
</script>
</body>
</html>
